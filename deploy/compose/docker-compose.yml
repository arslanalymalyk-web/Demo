# Single-node deployment on the client's own infrastructure. One deployment per institution.
#   cp .env.example .env   (fill it in)      mkdir secrets && see secrets/README for the files        place TLS files in ./tls
#   docker compose build && docker compose up -d
# The API and database sit on an internal network with no route out. The proxy is the only published service.
# Scheduled ingestion runs as a separate, short-lived container that is the only one allowed to reach the public data sources.
name: tigeris

networks:
  backend: { internal: true }        # database, API and proxy talk here. No outbound route.
  idp: {}                            # lets the API reach the institution's identity provider for signing keys. Restrict it with the client's network policy to that one host.
  egress: {}                         # used only by the ingest job. Restrict it to the allowlisted source hosts.

secrets:
  db_owner_password: { file: ./secrets/db_owner_password }
  db_app_password: { file: ./secrets/db_app_password }
  db_owner_url: { file: ./secrets/db_owner_url }          # postgres://tigeris_owner:...@db:5432/tigeris
  db_app_url: { file: ./secrets/db_app_url }              # postgres://tigeris_app:...@db:5432/tigeris
  postgres_password: { file: ./secrets/postgres_password }
  metrics_token: { file: ./secrets/metrics_token }
  backup_key: { file: ./secrets/backup_key }

volumes:
  pgdata: {}
  clamdb: {}

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "10" } }

services:
  db:
    <<: *hardening
    build: { context: ../.., dockerfile: deploy/db/Dockerfile }
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
      APP_PASSWORD_FILE: /run/secrets/db_app_password
      TIGERIS_BACKUP_ENV: /etc/tigeris/backup.env
    secrets: [postgres_password, db_owner_password, db_app_password, backup_key]
    command: >
      postgres -c wal_level=replica -c archive_mode=on -c archive_timeout=300
      -c "archive_command=/opt/tigeris/backup/archive-wal.sh %p %f"
      -c password_encryption=scram-sha-256 -c log_connections=on -c log_disconnections=on -c ssl=off
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ../backup:/opt/tigeris/backup:ro
      - ./backup.env:/etc/tigeris/backup.env:ro
      - ${BACKUP_DIR:?set BACKUP_DIR in .env}:/backups
    networks: [backend]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d tigeris"], interval: 10s, timeout: 5s, retries: 12 }

  migrate:
    build: { context: ../.., dockerfile: Dockerfile, target: app }
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment: { DATABASE_URL_OWNER_FILE: /run/secrets/db_owner_url }
    secrets: [db_owner_url]
    entrypoint: ["node", "db/migrate.mjs"]
    networks: [backend]
    depends_on: { db: { condition: service_healthy } }

  # First-run set-up, once per deployment: docker compose --profile setup run --rm setup check|apply ...
  # It needs the migrations applied and no TIGERIS_INSTITUTION_ID yet; it prints the id to put in .env.
  setup:
    profiles: ["setup"]
    build: { context: ../.., dockerfile: Dockerfile, target: app }
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      DATABASE_URL_OWNER_FILE: /run/secrets/db_owner_url
      DATABASE_URL_FILE: /run/secrets/db_app_url
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      WEB_ORIGIN: https://${SERVER_NAME:-localhost}
      TIGERIS_ENV: production
    secrets: [db_owner_url, db_app_url]
    entrypoint: ["node", "--import", "tsx", "packages/setup/src/cli.ts"]
    networks: [backend, idp]
    depends_on: { migrate: { condition: service_completed_successfully } }

  app:
    <<: *hardening
    build: { context: ../.., dockerfile: Dockerfile, target: app }
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]          # document extraction works here and is cleared on restart
    environment:
      TIGERIS_INSTITUTION_ID: ${TIGERIS_INSTITUTION_ID:?set TIGERIS_INSTITUTION_ID}
      DATABASE_URL_FILE: /run/secrets/db_app_url
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-tigeris-api}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:?}
      TIGERIS_TRUST_PROXY: "true"
      TIGERIS_CLIENT_DATA_ENABLED: ${TIGERIS_CLIENT_DATA_ENABLED:-false}
      TIGERIS_CLIENT_DATA_REVIEW_DONE: ${TIGERIS_CLIENT_DATA_REVIEW_DONE:-false}
      TIGERIS_REASONING_PROVIDER: ${TIGERIS_REASONING_PROVIDER:-off}   # off | anthropic | openai_compatible | local_extractive
      TIGERIS_MODEL_NAME: ${TIGERIS_MODEL_NAME:-}
      TIGERIS_MODEL_BASE_URL: ${TIGERIS_MODEL_BASE_URL:-}
      # A hosted model also needs: the egress network below, the model host on the network allowlist, and TIGERIS_MODEL_API_KEY_FILE pointing at a mounted secret.
      # Scheduled ingestion runs inside the API. It needs the egress network below and the source hosts on the network allowlist; off by default.
      # Malware scanning of uploads (profile "scanner" below). Required before institution documents are enabled.
      TIGERIS_SCANNER: ${TIGERIS_SCANNER:-off}                        # off | clamav
      TIGERIS_CLAMAV_HOST: ${TIGERIS_CLAMAV_HOST:-clamav}
      TIGERIS_CLAMAV_PORT: ${TIGERIS_CLAMAV_PORT:-3310}
      # Alerts by email through the client's own mail relay. Off by default. The relay must be reachable from this container (add its network),
      # and the relay password goes in a mounted secret: TIGERIS_SMTP_PASSWORD_FILE.
      TIGERIS_ALERTS_ENABLED: ${TIGERIS_ALERTS_ENABLED:-false}
      TIGERIS_SMTP_HOST: ${TIGERIS_SMTP_HOST:-}
      TIGERIS_SMTP_PORT: ${TIGERIS_SMTP_PORT:-587}
      TIGERIS_SMTP_SECURITY: ${TIGERIS_SMTP_SECURITY:-starttls}
      TIGERIS_SMTP_USER: ${TIGERIS_SMTP_USER:-}
      TIGERIS_ALERTS_FROM: ${TIGERIS_ALERTS_FROM:-}
      TIGERIS_WEB_BASE_URL: https://${SERVER_NAME:-localhost}
      # Base backups are recorded by the backup script. If the newest good one is older than this many hours, or the newest run failed, administrators are alerted. 0 turns it off.
      TIGERIS_BACKUP_MAX_AGE_HOURS: ${TIGERIS_BACKUP_MAX_AGE_HOURS:-36}
      TIGERIS_SCHEDULER_ENABLED: ${TIGERIS_SCHEDULER_ENABLED:-false}
      TIGERIS_SCHEDULER_TICK_SECONDS: ${TIGERIS_SCHEDULER_TICK_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [db_app_url, metrics_token]
    networks: [backend, idp]
    depends_on: { migrate: { condition: service_completed_successfully } }

  # ClamAV, opt-in: docker compose --profile scanner up -d. It listens on the internal network only; the egress network lets it refresh its signatures
  # (restrict that to the ClamAV signature hosts). Pin the image by digest for a release.
  clamav:
    profiles: ["scanner"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    environment:
      CLAMD_STARTUP_TIMEOUT: "180"
    volumes:
      - clamdb:/var/lib/clamav
    networks: [backend, egress]
    healthcheck: { test: ["CMD", "/usr/local/bin/clamdcheck.sh"], interval: 60s, timeout: 10s, retries: 5, start_period: 180s }

  proxy:
    <<: *hardening
    build: { context: ../.., dockerfile: Dockerfile, target: web }
    cap_drop: ["ALL"]
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:?set OIDC_AUTHORITY (https://...)}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-tigeris-web}
      API_UPSTREAM: http://app:3000
    ports: ["80:8080", "443:8443"]
    volumes: ["./tls:/etc/nginx/tls:ro"]
    networks: [backend, default]
    depends_on: [app]

  # Run on a schedule from the host:  docker compose run --rm ingest --source <source-key>
  ingest:
    profiles: ["ingest"]
    build: { context: ../.., dockerfile: Dockerfile, target: app }
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
    environment: { TIGERIS_INSTITUTION_ID: "${TIGERIS_INSTITUTION_ID:-}", DATABASE_URL_FILE: /run/secrets/db_app_url }
    secrets: [db_app_url]
    entrypoint: ["node", "--use-env-proxy", "--import", "tsx", "packages/ingest/src/cli.ts"]
    networks: [backend, egress]
    depends_on: { db: { condition: service_healthy } }
