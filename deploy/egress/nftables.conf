# Host firewall for the Docker host: the second layer under the egress proxy.
# Only the egress proxy container may start connections to the outside world; the API, database, ingest and set-up containers may not, even if a container were misconfigured.
# Fill in the two addresses, check it (nft -c -f nftables.conf), then load it (nft -f nftables.conf). Persist it the way the host's distribution does.
# Docker evaluates the DOCKER-USER chain before its own rules, so this works alongside Docker's own filtering.
#
#   EGRESS_PROXY_IP  the address of the egress-proxy container on the egress network (docker inspect), fixed with ipv4_address in the compose file for a stable rule
#   DNS_IP           the resolver the proxy uses (usually the institution's own)
define EGRESS_PROXY_IP = 172.30.0.2
define DNS_IP = 10.0.0.53
define DOCKER_POOL = 172.16.0.0/12

table inet tigeris_egress {
  chain forward_out {
    type filter hook forward priority -10; policy accept;
    # Traffic that stays inside the host's container networks and replies to established connections is not outbound.
    ct state established,related accept
    iifname != "docker0" iifname != "br-*" accept
    ip saddr $EGRESS_PROXY_IP accept
    # Anything else leaving a container network, including the institution's own LAN, is dropped and counted.
    # Container-to-container traffic stays inside Docker's own address pool. Set this to the pool the host uses (docker network inspect); the rest of the institution's private ranges are NOT allowed from a container: reach them through the proxy with EGRESS_ALLOW_PRIVATE.
    ip daddr $DOCKER_POOL accept
    udp dport 53 ip daddr $DNS_IP ip saddr $EGRESS_PROXY_IP accept
    counter drop comment "tigeris: container tried to reach outside without the egress proxy"
  }
}
