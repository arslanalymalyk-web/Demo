# Weekly update proposals for the three things that go stale: npm packages, GitHub Actions and the base images. A person reviews each one; CI (audit, licence check, tests, browser suite) must pass first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/db
    schedule: { interval: weekly }
